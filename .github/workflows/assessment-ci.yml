name: Assessment CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assessment-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python API and evidence validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install the production dependencies used by the assessment API
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          selected = {"fastapi", "httpx", "pydantic", "anthropic", "firebase-admin", "cryptography", "pypdf", "reportlab"}
          lines = Path("backend/requirements.txt").read_text().splitlines()
          requirements = [line for line in lines if re.split(r"[<>=\[]", line)[0].strip().lower() in selected]
          Path("/tmp/assessment-requirements.txt").write_text("\n".join(requirements) + "\n")
          PY
          python -m pip install -r /tmp/assessment-requirements.txt
      - name: Validate authenticated API contracts, source evidence and ingestion
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -v
      - name: Check backend syntax
        run: python -m compileall -q backend

  frontend:
    name: Production build and browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_FIREBASE_API_KEY: ci-placeholder-api-key
      VITE_FIREBASE_AUTH_DOMAIN: assessment-ci.invalid
      VITE_FIREBASE_PROJECT_ID: assessment-ci
      VITE_FIREBASE_STORAGE_BUCKET: assessment-ci.invalid
      VITE_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
      VITE_FIREBASE_APP_ID: "1:1234567890:web:ci"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked application dependencies
        working-directory: frontend
        run: npm ci
      - name: Check missing frontmatter fails the build
        working-directory: frontend
        run: |
          post=content/blog/ai-security-wrong-problem.md
          cp "$post" "$RUNNER_TEMP/kya-original-post.md"
          trap 'cp "$RUNNER_TEMP/kya-original-post.md" "$post"' EXIT
          sed -i '/^title:/d' "$post"
          if npm run build > "$RUNNER_TEMP/kya-invalid-frontmatter.log" 2>&1; then
            echo "Build unexpectedly accepted a post without its required title"
            exit 1
          fi
          grep -F "ai-security-wrong-problem.md: title is required" "$RUNNER_TEMP/kya-invalid-frontmatter.log"
          cp "$RUNNER_TEMP/kya-original-post.md" "$post"
          trap - EXIT
      - name: Build production assets
        working-directory: frontend
        run: npm run check
      - name: Check the prerendered tools heading
        working-directory: frontend
        run: grep -c "<h1" dist/tools.html
      - name: Check guide content lint rejects invalid source
        working-directory: frontend
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync, writeFileSync, mkdirSync, rmSync } from "node:fs";
          import { spawnSync } from "node:child_process";
          import { caseStudies, getStages } from "./dist-ssr/entry-server.js";
          const file = "content/controls/tool-argument-validation.md";
          const original = readFileSync(file, "utf8");
          const reject = (rule) => {
            const result = spawnSync(process.execPath, ["scripts/verify-dist.mjs"], { encoding: "utf8" });
            assert.notEqual(result.status, 0, `${rule} accepted invalid content`);
            assert.ok(result.stdout.includes(`${rule} FAIL:`), result.stdout + result.stderr);
            console.log(`${rule} negative control passed`);
          };
          try {
            for (const [rule, changed] of [
              ["R13", original.replace("stage: before-first-users", "stage: missing-stage")],
              ["R14", original.replace("## The risk", "## Wrong heading")],
              ["R15", original.slice(0, original.indexOf("## The risk")) + "## The risk\nShort."],
              ["R16", original + "\nA revolutionary example.\n"],
              ["R20", original + `\n${caseStudies[0].target}\n`],
            ]) {
              writeFileSync(file, changed);
              reject(rule);
            }
          } finally {
            writeFileSync(file, original);
          }
          const fixture = "content/builds/m3-lint-probe.md";
          mkdirSync("content/builds", { recursive: true });
          try {
            writeFileSync(fixture, "---\ntitle: Test\ndescription: Test fixture\ncontrols: [missing-control]\nreview: pending\nupdated: 2026-10-11\n---\nTest\n");
            reject("R17");
          } finally {
            rmSync(fixture);
          }
          assert.equal(getStages().length, 5);
          for (const stage of getStages()) {
            const words = stage.body.split(/\s+/).length;
            assert.ok(words >= 150 && words <= 250, `${stage.slug}: ${words} words`);
            console.log(`${stage.slug}: ${words} words`);
          }
          JS
          npm run verify
      - name: Check Hosting routes in the GitHub runner emulator
        run: |
          cat > "$RUNNER_TEMP/verify-kya-hosting.mjs" <<'JS'
          import assert from "node:assert/strict";
          const base = "http://127.0.0.1:5000";
          const get = (path, redirect = "manual") => fetch(`${base}${path}`, { redirect, signal: AbortSignal.timeout(10000) });
          const tools = await get("/tools");
          console.log(`/tools: ${tools.status}`);
          assert.equal(tools.status, 200);
          const html = await tools.text();
          const slash = await get("/tools/");
          console.log(`/tools/: ${slash.status}`);
          assert.ok([200, 301].includes(slash.status));
          const normalized = slash.status === 301 ? await get("/tools/", "follow") : slash;
          assert.equal(await normalized.text(), html);
          for (const path of ["/does-not-exist"]) {
            const response = await get(path);
            console.log(`${path}: ${response.status}`);
            assert.equal(response.status, 404);
          }
          const llms = await get("/llms.txt");
          console.log(`/llms.txt: ${llms.status}`);
          assert.equal(llms.status, 200);
          assert.ok((await llms.text()).startsWith("# KnowYourAI\n"));
          for (const path of ["/dashboard", "/intentscan", "/enforce", "/demo"]) {
            const response = await get(path);
            console.log(`${path}: ${response.status}`);
            assert.equal(response.status, 200);
            assert.match(await response.text(), /<meta name="robots" content="noindex">/);
          }
          const script = html.match(/<script\b[^>]*src="([^"]+)"[^>]*>/)?.[1];
          assert.ok(script);
          const asset = await get(script);
          assert.equal(asset.status, 200);
          assert.match(asset.headers.get("cache-control"), /max-age=31536000/);
          assert.match(asset.headers.get("cache-control"), /immutable/);
          console.log("Hosting checks passed, including app shells and immutable assets.");
          JS
          npx --yes firebase-tools emulators:exec --only hosting --project demo-kya "node '$RUNNER_TEMP/verify-kya-hosting.mjs'"
      - name: Install the isolated browser test harness
        run: |
          mkdir -p "$RUNNER_TEMP/assessment-browser/tests"
          npm install --prefix "$RUNNER_TEMP/assessment-browser" --no-save --package-lock=false --ignore-scripts @playwright/test@1.64.0
          cp frontend/playwright.config.ts "$RUNNER_TEMP/assessment-browser/playwright.config.ts"
          cp frontend/tests/assessment.spec.ts "$RUNNER_TEMP/assessment-browser/tests/assessment.spec.ts"
          cd "$RUNNER_TEMP/assessment-browser"
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser checks on the GitHub runner
        env:
          ASSESSMENT_FRONTEND_DIR: ${{ github.workspace }}/frontend
        run: |
          cd "$RUNNER_TEMP/assessment-browser"
          ./node_modules/.bin/playwright test
      - name: Upload screenshots, downloads and browser report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: assessment-browser-report
          path: |
            ${{ runner.temp }}/assessment-browser/playwright-report
            ${{ runner.temp }}/assessment-browser/test-results
          if-no-files-found: ignore
          retention-days: 7
